[bot]
appid = ""
secret = ""

[limits]
max_file_size_mb = 30
parse_timeout_seconds = 300
rate_limit_count = 10
rate_limit_window_seconds = 60

[cache]
file_ttl_seconds = 600   # 视频/封面文件的缓存时长（两者共用）
metadata_ttl_seconds = 1800
duplicate_window_seconds = 600
cleanup_interval_seconds = 60   # 缓存定时清理间隔，过期文件将被删除；<=0 禁用

[behavior]
report_errors = false     # 解析失败/超时/重复时是否回复错误提示
media_with_text = true    # 尝试封面+文字同条发送；平台不支持时自动拆为两条

[platforms.bilibili]
enabled = true

[admin]
command = "/管理"                  # 管理指令触发词，同时用于指令面板注册
register_panel = true              # 启动时通过 QQ 指令面板接口注册该指令
session_store_path = "data/session_settings.json"   # 会话级解析开关的持久化文件；留空则仅存内存
