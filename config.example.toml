[bot]
appid = ""
secret = ""

[limits]
max_file_size_mb = 30
probe_real_size = true   # 下载前向 B 站 CDN 发 Range 请求探测实际大小，失败自动回落估算
parse_timeout_seconds = 300
error_retry_count = 3    # yt-dlp 解析遇暂时性错误（HTTP 412/429/5xx）时的重试次数；0 不重试
rate_limit_count = 10
rate_limit_window_seconds = 60

[cache]
file_ttl_seconds = 600   # 视频/封面文件的缓存时长（两者共用）
metadata_ttl_seconds = 1800
duplicate_window_seconds = 600
cleanup_interval_seconds = 60   # 缓存定时清理间隔，过期文件将被删除；<=0 禁用

[behavior]
report_errors = false     # 解析失败/超时/重复时是否回复错误提示
media_with_text = true    # 尝试封面+文字同条发送；平台不支持时自动拆为两条

[platforms.bilibili]
enabled = true

[platforms.douyin]
enabled = true
cookies_file = "data/douyin_cookies.txt"
browser_enabled = true  # 抖音浏览器直取主链路开关；关闭则回落纯 yt-dlp
browser_proxy = ""  # 浏览器代理（如 http://127.0.0.1:7897），留空直连
  # 抖音匿名 cookies 文件（Netscape 格式）；失效时自动刷新，刷不出时可手动导出覆盖

[admin]
command = "/管理"                  # 管理指令触发词，同时用于指令面板注册
register_panel = true              # 启动时通过 QQ 指令面板接口注册该指令
session_store_path = "data/session_settings.json"   # 会话级解析开关的持久化文件；留空则仅存内存
